# ---------------------------------------------------------------
# SistemaGestionAcademica - configuración por defecto
# Cada valor puede sobrescribirse con variables de entorno
# (por ejemplo SERVER_PORT o SPRING_PROFILES_ACTIVE), lo que permite
# usar la misma imagen Docker en desarrollo y producción.
# ---------------------------------------------------------------
spring.application.name=SistemaGestionAcademica
server.port=${SERVER_PORT:8080}
app.version=@project.version@
app.datos-demo=true

# Base de datos H2 en memoria (no requiere instalación)
spring.datasource.url=jdbc:h2:mem:gestionacademica;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Actuator: salud de la aplicación para Docker y Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.nombre=SistemaGestionAcademica
info.app.version=@project.version@

# Apagado ordenado (permite rolling updates sin cortar peticiones)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
