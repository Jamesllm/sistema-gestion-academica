# Perfil "postgres": se activa con SPRING_PROFILES_ACTIVE=postgres
# Las credenciales se inyectan como variables de entorno (Secret de Kubernetes).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestionacademica}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
