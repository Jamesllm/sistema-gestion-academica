# Service: punto de acceso estable que balancea el tráfico entre los Pods.
# NodePort expone la aplicación en http://<IP-del-nodo>:30080
apiVersion: v1
kind: Service
metadata:
  name: gestion-academica-service
  labels:
    app: gestion-academica
spec:
  type: NodePort
  selector:
    app: gestion-academica
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
